services:
  app:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    container_name: backend_ta_lautan_teduh
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      # Database
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: admin
      DB_PASS: ta-lautan
      DB_NAME: ta_lautan_db
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # JWT & Auth
      JWT_SECRET: ${JWT_SECRET}
      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      # Fonnte (WhatsApp API)
      FONNTE_TOKEN: ${FONNTE_TOKEN}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - appnet
      - proxy_net

  redis:
    image: redis:7-alpine
    container_name: redis_ta_lautan_teduh
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - appnet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    container_name: worker_ta_lautan_teduh
    restart: always
    command: ["./main_worker"]
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FONNTE_TOKEN: ${FONNTE_TOKEN}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - appnet

  db:
    image: postgres:15-alpine
    container_name: database_ta_lautan_teduh
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ta-lautan
      POSTGRES_DB: ta_lautan_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - appnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ta_lautan_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  redis_data:

networks:
  appnet:
    driver: bridge
  proxy_net:
    external: true
