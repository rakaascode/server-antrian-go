services:
  app:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    container_name: backend_ta_lautan_teduh
    restart: always
    expose:
      - "8080:8080"
    env_file:
      - ../.env
    environment:
      # Database
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: admin
      DB_PASS: ta-lautan
      DB_NAME: ta_lautan_db
      # JWT & Auth
      JWT_SECRET: ${JWT_SECRET}
      # Google OAuth (Client ID dari Google Cloud Console — Android)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      # Fonnte (WhatsApp API)
      FONNTE_TOKEN: ${FONNTE_TOKEN}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - appnet

  db:
    image: postgres:15-alpine
    container_name: database_ta_lautan_teduh
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ta-lautan
      POSTGRES_DB: ta_lautan_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - appnet
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d ta_lautan_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: nginx_ta_lautan
    restart: always
    ports:
      - "8080:8080"
      - "443:443"
    volumes:
      - ../nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - appnet

volumes:
  db_data:

networks:
  appnet:
    driver: bridge
