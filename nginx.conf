# ── Zone Rate Limiting ──────────────────────────────────────────
# 1. Zone umum API (maksimal 30 request/detik per IP)
limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=30r/s;

# 2. Zone sensitif Auth / Login (maksimal 10 request/menit per IP)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

# Status Code jika terkena batas limit (429 Too Many Requests)
limit_req_status 429;

server {
    listen 80;
    server_name rakaascode.site www.rakaascode.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name rakaascode.site www.rakaascode.site;

    ssl_certificate /etc/letsencrypt/live/rakaascode.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rakaascode.site/privkey.pem;

    # SSL security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Sembunyikan versi Nginx
    server_tokens off;

    # Ukuran body max 10MB (untuk upload gambar broadcast)
    client_max_body_size 10M;

    # ── Security Headers ─────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Rate limiting ketat untuk endpoint Auth (Login & Google Auth)
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass         http://backend_ta_lautan_teduh:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Rate limiting umum untuk seluruh API lainnya
    location / {
        limit_req zone=api_general_limit burst=20 nodelay;

        proxy_pass         http://backend_ta_lautan_teduh:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout untuk long-running request
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
