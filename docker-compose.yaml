services:
  app:
    build: .
    container_name: backend_ta_lautan_teduh
    ports: 
      - "8080:8080"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASS=ta-lautan
      - DB_NAME=ta_lautan_db

  db:
      image: postgres:15
      container_name: database_ta_lautan_teduh
      restart: always
      environment:
        POSTGRES_USER: admin
        POSTGRES_PASSWORD: ta-lautan
        POSTGRES_DB: ta_lautan_db
      ports:
      - "5432:5432" 
      volumes:
      - "db_data:/var/lib/postgresql/data"

volumes:
  db_data: 